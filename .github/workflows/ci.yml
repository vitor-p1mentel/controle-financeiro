name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a ## v7.0.1
      - uses: actions/setup-python@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a ## v7.0.1
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a ## v7.0.1
      - uses: actions/setup-python@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a ## v7.0.1
        with:
          python-version: "3.14"
      - run: pip install bandit pip-audit
      - name: Análise estática (Bandit)
        run: bandit -r app -ll
      - name: Dependências vulneráveis (pip-audit)
        run: pip-audit -r requirements.txt

  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a ## v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a ## v7.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagem:
    name: Imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a ## v7.0.1
      - name: Construir a imagem
        run: docker build -t controle-financeiro:ci .
      - name: Escanear com Trivy
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.35.0
        with:
          image-ref: controle-financeiro:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install bandit pip-audit
      - name: Análise estática (Bandit)
        run: bandit -r app -ll
      - name: Dependências vulneráveis (pip-audit)
        run: pip-audit -r requirements.txt

  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagem:
    name: Imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Construir a imagem
        run: docker build -t controle-financeiro:ci .
      - name: Escanear com Trivy
        uses: aquasecurity/trivy-action@COLE_AQUI_O_SHA_COMPLETO # v0.xx.x
        with:
          image-ref: controle-financeiro:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"